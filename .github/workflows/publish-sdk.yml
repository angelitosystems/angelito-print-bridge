#
# Publishes the SDK packages (@angelitosystems/print-bridge and its framework integrations) to GitHub Packages when a
# maintainer publishes a stable GitHub Release tagged `sdk-<label>` (the explicit authorization).
# Each package is published only if its package.json version is not in the registry yet, so unchanged packages and
# duplicate versions are skipped. Uses only the automatic GITHUB_TOKEN (no npm tokens, no PATs, no npmjs.com).
name: publish-sdk

on:
  release:
    types: [published]

permissions:
  contents: read
  packages: write

concurrency:
  group: publish-sdk
  cancel-in-progress: false

jobs:
  publish:
    if: >-
      github.repository == 'angelitosystems/angelito-print-bridge' &&
      startsWith(github.event.release.tag_name, 'sdk-') &&
      !github.event.release.prerelease && !github.event.release.draft
    runs-on: windows-latest
    environment: github-packages
    outputs:
      published: ${{ steps.publish.outputs.published }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}
          fetch-depth: 0
          persist-credentials: false

      - name: Release commit must be on main
        shell: bash
        run: |
          git fetch --no-tags origin main
          git merge-base --is-ancestor "$(git rev-parse HEAD)" origin/main || { echo "::error::Tag is not on main"; exit 1; }

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          registry-url: https://npm.pkg.github.com
          scope: '@angelitosystems'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Select packages whose version is not published yet
        id: select
        shell: bash
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TODO=""
          for dir in packages/*/; do
            dir="${dir%/}"
            [ "$(node -p "!!require('./$dir/package.json').private")" = "true" ] && continue
            spec=$(node -p "const p=require('./$dir/package.json'); p.name+'@'+p.version")
            if npm view "$spec" version >/dev/null 2>&1; then echo "skip $spec (already published)"; else echo "will publish $spec"; TODO="$TODO $dir"; fi
          done
          [ -n "$TODO" ] || { echo "::error::No package has an unpublished version. Bump versions before releasing."; exit 1; }
          echo "dirs=$TODO" >> "$GITHUB_OUTPUT"

      - run: npm ci
      - run: npm run build
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test

      - name: Build the Windows agent for E2E
        run: dotnet build src/Angelito.PrintBridge.Agent -c Release
      - name: E2E against the real agent
        working-directory: packages/core
        env:
          APB_AGENT_EXE: ${{ github.workspace }}/src/Angelito.PrintBridge.Agent/bin/Release/net10.0-windows10.0.19041.0/AngelitoPrintBridge.exe
        run: npm run test:e2e

      - name: Publish to GitHub Packages (core first)
        id: publish
        shell: bash
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DIRS: ${{ steps.select.outputs.dirs }}
        run: |
          ORDERED=$(for d in $DIRS; do [ "$d" = "packages/core" ] && echo "0 $d" || echo "1 $d"; done | sort | cut -d' ' -f2)
          SPECS=""
          for dir in $ORDERED; do
            # Angular is built in Angular Package Format: publish its generated dist/ (no scripts, APF entry points).
            pub="$dir"; [ -f "$dir/ng-package.json" ] && pub="$dir/dist"
            (cd "$pub" && npm pack --dry-run && npm publish)
            SPECS="$SPECS,$(node -p "const p=require('./$dir/package.json'); p.name+'@'+p.version")"
          done
          echo "published=${SPECS#,}" >> "$GITHUB_OUTPUT"

  verify-install:
    # Independent consumer project: installs every just-published version from GitHub Packages and imports it.
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          registry-url: https://npm.pkg.github.com
          scope: '@angelitosystems'
      - name: Install and import from GitHub Packages
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PUBLISHED: ${{ needs.publish.outputs.published }}
        run: |
          mkdir consumer && cd consumer
          npm init -y >/dev/null && npm pkg set type=module
          SPECS=$(echo "$PUBLISHED" | tr ',' ' ')
          # Peer dependencies a real app would already have.
          PEERS="@angelitosystems/print-bridge react@19 vue@3 svelte@5 @angular/core@22 @angular/common@22 rxjs@7"
          for i in 1 2 3 4 5; do npm install $SPECS $PEERS && break; sleep 20; done
          FAILED=0
          for spec in $SPECS; do
            name="${spec%@*}"
            if node -e "import('$name').then(m => { if (!Object.keys(m).length) process.exit(1); console.log('OK $spec', Object.keys(m).join(',')); })"                && grep -q '"license": "Apache-2.0"' "node_modules/$name/package.json"; then :; else echo "::error::$spec failed"; FAILED=1; fi
          done
          exit $FAILED
