#
# Builds the website (Astro + Starlight) and deploys it to GitHub Pages. Runs on validated changes in main, after each
# successful agent release (so the download page shows the new version with its assets) and manually. Never runs for
# pull requests. Always deploys from main: the github-pages environment rejects tag refs.
name: pages

on:
  push:
    branches: [main]
    paths: ["apps/website/**", "packages/**", "examples/**", "package-lock.json", ".github/workflows/pages.yml"]
  workflow_run:
    workflows: [release-agent]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    if: >-
      github.repository == 'angelitosystems/angelito-print-bridge' &&
      (github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - name: Build the SDK packages (used by the playground and the examples)
        run: |
          npm run build -w @angelitosystems/print-bridge
          npm run build -w @angelitosystems/print-bridge-react -w @angelitosystems/print-bridge-vue -w @angelitosystems/print-bridge-svelte -w @angelitosystems/print-bridge-angular
      - uses: actions/configure-pages@v5
      - name: Typecheck
        run: npm run typecheck -w website
      - name: Build site + examples (under /examples/<name>/) and check internal links
        env:
          # Read-only access to the public Releases API (download page), avoids anonymous rate limits.
          GITHUB_TOKEN: ${{ github.token }}
        run: npm run build:pages -w website
      - uses: actions/upload-pages-artifact@v4
        with:
          path: apps/website/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
